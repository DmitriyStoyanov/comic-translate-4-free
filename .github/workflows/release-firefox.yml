name: Build Firefox release zip

# Browser-only releases (2026-11-05, James's decision): Chrome and
# Firefox have independent versions, but there are no version tags or
# version releases anymore — only the "Chrome" and "Firefox" moving
# tags and their releases, so the Releases page shows just the two
# latest builds. Rollback is via git itself (the old version tags are
# kept as labels on old commits, and any commit can be checked out);
# it is very rarely needed.
# On every push to main: build the Firefox zip and upload it as a workflow
# artifact, so a fresh Firefox zip always exists.
# On every Firefox tag push: build the Firefox zip and update the
# "Firefox" release (replace the old zip, update the notes to the new
# version from manifest.firefox.json), so the release always holds the
# latest Firefox build. There are only two releases (Chrome + Firefox),
# so the updated release is always visible — no delete/recreate needed.
on:
  push:
    branches:
      - main
    tags:
      - 'Firefox'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Firefox zip
        run: ./build.sh firefox

      - name: Upload Firefox zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-zip-${{ github.sha }}
          path: |
            dist/*-firefox.zip
          if-no-files-found: error

      - name: Update the Firefox release
        if: github.ref == 'refs/tags/Firefox'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.firefox.json').version")
          ZIP="dist/comic-translate-4-free-v${VERSION}-firefox.zip"
          # Replace the old zip (keep only the latest build in the release)
          for asset in $(gh release view Firefox --json assets --jq '.assets[].name' 2>/dev/null); do
            gh release delete-asset Firefox "$asset" --yes
          done
          gh release upload Firefox "$ZIP" --clobber
          NOTES=$(printf 'Latest Firefox build: v%s.\n\nThis tag always points to the newest Firefox release. The zip here is the current Firefox build.' "$VERSION")
          gh release edit Firefox --title "Firefox" --notes "$NOTES"
